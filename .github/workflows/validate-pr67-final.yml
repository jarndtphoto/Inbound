name: Validate PR67 final surface and arrival head
on:
  push:
    branches:
      - validation/main-check-20261005
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6527d50e77628ff3c2568dde7995b9e5d1f71071
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - name: npm run check
        run: npm run check
      - name: npm run build
        run: npm run build
