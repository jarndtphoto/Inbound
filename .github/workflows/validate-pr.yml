name: Validate PR

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - name: npm run check
        run: npm run check
      - name: npm run build
        run: npm run build
